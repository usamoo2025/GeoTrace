
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GeoTrace</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #080d1b;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            border: 1px solid #263451;
            border-radius: 18px;
            background: #111a2d;
            box-shadow: 0 20px 60px #0005;
        }
        .brand { color: #67e8f9; font-size: 27px; font-weight: bold; }
        h1 { margin: 24px 0 8px; font-size: 25px; }
        .muted { color: #9ca3af; line-height: 1.6; }
        label { display: block; margin: 18px 0 8px; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #34445f;
            border-radius: 9px;
            background: #0b1222;
            color: white;
            outline: none;
        }
        input:focus { border-color: #22d3ee; }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #0891b2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #451a24;
            color: #fecaca;
        }
        .footer { margin-top: 22px; text-align: center; color: #9ca3af; }
        a { color: #67e8f9; text-decoration: none; }
    </style>
</head>
<body>
    <main class="auth-card">
        <div class="brand">GeoTrace</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to access your private dashboard.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label for="identity">Username or email</label>
            <input id="identity" name="identity" required
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   required autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="/register">Register</a>
        </div>
    </main>
</body>
</html>
